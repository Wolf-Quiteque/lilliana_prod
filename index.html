  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0c0d; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #0d0c0d; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }

  <style id="__lp_css">
    /* ------------------------------------------------------------------------
       Creative preloader — "on set": a 9:16 reel frame with a live REC /
       timecode, a spinning camera aperture around the LP monogram, a record
       progress scrub, a services marquee and live status. Matches the site's
       dark #0d0c0d base and accent pink #e13b82. Pure CSS + tiny JS; the whole
       shell is replaced by the decoded page when loading finishes.
    ------------------------------------------------------------------------- */
    #__bundler_loading {
      position: fixed; inset: 0; z-index: 10000;
      background: #0d0c0d;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 20px;
      opacity: 1;
      transition: opacity .45s ease;
    }
    #__bundler_loading.__lp_done { opacity: 0; pointer-events: none; }

    .__lp_glow {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 42%, rgba(225,59,130,.16) 0%, rgba(225,59,130,.05) 34%, transparent 68%);
    }
    .__lp_grain {
      position: absolute; inset: 0; pointer-events: none; opacity: .05;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      animation: __lp_flicker 1.6s steps(2) infinite;
    }
    #__bundler_loading::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 42%, transparent 58%, rgba(0,0,0,.4) 100%);
    }
    @keyframes __lp_flicker { 0%, 100% { opacity: .04; } 50% { opacity: .08; } }

    /* the 9:16 phone / reel frame */
    .__lp_frame {
      width: min(170px, 46vw); aspect-ratio: 9 / 16;
      border: 1.5px solid rgba(255,255,255,.16); border-radius: 22px;
      background: linear-gradient(180deg, #131114 0%, #0a090a 60%, #131114 100%);
      box-shadow: 0 0 0 1px rgba(225,59,130,.25), 0 24px 60px rgba(0,0,0,.5), 0 0 46px rgba(225,59,130,.18);
      overflow: hidden; position: relative;
    }
    .__lp_frame_top {
      position: absolute; top: 0; left: 0; right: 0; height: 34px; z-index: 2;
      display: flex; align-items: center; gap: 6px; padding: 0 10px;
      background: linear-gradient(180deg, rgba(17,16,19,.94), rgba(17,16,19,0));
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; color: #fff;
    }
    .__lp_dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 0 3.5px rgba(255,59,48,.22); animation: __lp_blink 1.1s steps(2) infinite; flex: none; }
    @keyframes __lp_blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .25; } }
    .__lp_rec { color: #ff6b64; letter-spacing: .18em; }
    .__lp_tc { margin-left: auto; color: rgba(255,255,255,.6); }

    /* camera aperture + monogram */
    .__lp_lens { position: absolute; left: 50%; top: 47%; width: min(148px, 82%); aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 1; display: grid; place-items: center; }
    .__lp_a1 {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px dashed rgba(225,59,130,.5);
      animation: __lp_spin 4.2s linear infinite;
    }
    .__lp_a2 {
      position: absolute; width: 132px; height: 132px; border-radius: 50%;
      border: 3px solid transparent; border-top-color: rgba(225,59,130,.85); border-right-color: rgba(225,59,130,.85);
      animation: __lp_spin 1.9s linear infinite reverse;
    }
    .__lp_a3 {
      position: absolute; width: 92px; height: 92px; border-radius: 50%;
      border: 3px solid transparent; border-bottom-color: rgba(255,255,255,.5); border-left-color: rgba(255,255,255,.24);
      animation: __lp_spin 1.3s linear infinite;
    }
    .__lp_mono {
      width: 64px; height: 64px; border-radius: 18px;
      background: rgba(225,59,130,.12); border: 1px solid rgba(225,59,130,.5);
      display: grid; place-items: center;
      font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 26px; font-weight: 700; color: #e13b82;
      animation: __lp_throb 1.4s ease-in-out infinite;
    }
    @keyframes __lp_spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes __lp_throb {
      0%, 100% { transform: scale(1); box-shadow: 0 0 18px rgba(225,59,130,.25); }
      50%      { transform: scale(1.06); box-shadow: 0 0 34px rgba(225,59,130,.5); }
    }

    /* record progress scrub — width driven by real unpack progress via JS */
    .__lp_scrub {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26px; z-index: 2;
      background: linear-gradient(0deg, rgba(17,16,19,.94), rgba(17,16,19,0));
      padding: 0 8px 7px;
    }
    .__lp_scrub_track { position: relative; height: 3px; border-radius: 99px; background: rgba(255,255,255,.14); }
    .__lp_scrub_fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 99px; background: linear-gradient(90deg, rgba(225,59,130,.55), #e13b82 55%, #ff5fa0); }
    .__lp_scrub_thumb { position: absolute; top: -3px; left: 0%; width: 11px; height: 11px; border-radius: 50%; background: #fff; border: 2px solid #e13b82; box-shadow: 0 1px 6px rgba(0,0,0,.5); }

    /* services marquee */
    .__lp_marquee { width: min(340px, 92vw); height: 18px; overflow: hidden; position: relative; }
    .__lp_marquee_inner { display: inline-block; white-space: nowrap; font-size: 0; will-change: transform; animation: __lp_marquee_key 26s linear infinite; }
    .__lp_half { display: inline-block; text-transform: uppercase; font-size: 10px; letter-spacing: .22em; color: #a8a2a4; white-space: nowrap; }
    .__lp_mq_dot { display: inline-block; color: #e13b82; font-size: 8px; margin: 0 8px; }
    @keyframes __lp_marquee_key { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* status + brand */
    .__lp_status_row { display: flex; align-items: center; gap: 10px; }
    .__lp_status_text { font-size: 12.5px; color: #f6f3f2; letter-spacing: .04em; }
    .__lp_pct { min-width: 40px; text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; color: rgba(225,59,130,.9); }
    .__lp_brand { display: flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .14em; color: #f6f3f2; }
    .__lp_brand::before { content: ""; width: 20px; height: 1.5px; background: #e13b82; }

    /* short screens (landscape phones, tiny windows) */
    @media (max-height: 520px) {
      .__lp_frame { width: 112px; }
      .__lp_a2 { width: 96px; height: 96px; }
      .__lp_a3 { width: 66px; height: 66px; }
      .__lp_mono { width: 48px; height: 48px; font-size: 20px; }
      .__lp_brand { display: none; }
      .__lp_grain, .__lp_glow { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .__lp_a1, .__lp_a2, .__lp_a3, .__lp_mono, .__lp_grain, .__lp_dot, .__lp_marquee_inner { animation: none; }
    }
  </style>

  <script>
    // Preloader timecode ticker — cosmetic only; stops when the loader is gone.
    (function () {
      var timer = null;
      function pad(n) { return (n < 10 ? '0' : '') + n; }
      function tick() {
        if (!document.getElementById('__bundler_loading')) { if (timer) { clearInterval(timer); timer = null; } return; }
        var tc = document.getElementById('__lp_tc');
        if (!tc) return;
        var start = window.__lpStart || (window.__lpStart = Date.now());
        var ms = Date.now() - start;
        tc.textContent = pad(Math.floor(ms / 3600000)) + ':' + pad(Math.floor(ms / 60000) % 60) + ':' + pad(Math.floor(ms / 1000) % 60) + ':' + (Math.floor(ms / 100) % 10);
      }
      tick();
      timer = setInterval(tick, 100);
    })();
  </script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) {
    const st = document.getElementById('__lp_status');
    if (st) st.textContent = msg;
    if (loading) loading.setAttribute('aria-label', msg || 'Loading');
  }
  // Drives the preloader record-scrub + percentage from real bundle progress.
  let __lp_done = 0;
  function __lp_progress(pct, label) {
    const fill = document.getElementById('__lp_scrub_fill');
    const thumb = document.getElementById('__lp_scrub_thumb');
    const pctEl = document.getElementById('__lp_pct');
    const p = Math.max(0, Math.min(1, pct));
    if (fill) fill.style.width = (p * 100).toFixed(1) + '%';
    if (thumb) thumb.style.left = (p * 100).toFixed(1) + '%';
    if (pctEl) pctEl.textContent = Math.round(p * 100) + '%';
    if (label) setStatus(label);
  }
  async function __lp_complete() {
    __lp_progress(1, 'Action! Ready for close-up.');
    const wrap = document.getElementById('__bundler_loading');
    if (!wrap) return;
    wrap.classList.add('__lp_done');
    await new Promise((r) => setTimeout(r, 520));
  }
  function __lp_sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
  function __lp_var(name) {
    try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
    catch (e) { return ''; }
  }
  // True once the dc-runtime has mounted the page into #dc-root and the
  // template's CSS variables are actually applied to <html>.
  function __lp_rendered() {
    const host = document.getElementById('dc-root');
    if (!host || !host.children || host.children.length === 0) return false;
    return __lp_var('--bg') !== '';
  }
  // Holds the preloader until the swapped-in page is genuinely interactive and
  // styled (React mount, helmet CSS, custom fonts, images) — never an
  // unstyled "boot" frame — with hard caps so it can never hang the site.
  async function __lp_wait_ready() {
    try {
      if (document.fonts && document.fonts.ready) {
        await Promise.race([document.fonts.ready, __lp_sleep(3000)]);
      }
    } catch (e) {}
    const bootDeadline = Date.now() + 5000;
    while (Date.now() < bootDeadline && !__lp_rendered()) await __lp_sleep(40);
    const imageDeadline = Date.now() + 2500;
    while (Date.now() < imageDeadline) {
      let imagesDone = true;
      for (const img of document.querySelectorAll('img')) {
        if (!(img.complete || (typeof img.naturalWidth === 'number' && img.naturalWidth > 0))) {
          imagesDone = false;
          break;
        }
      }
      if (imagesDone) break;
      await __lp_sleep(40);
    }
    if (__lp_rendered()) await __lp_sleep(180);
  }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {

  </section>`;
    const heroVisual = `
      <div style="position: relative; min-height: clamp(540px, 56vw, 650px); isolation: isolate;">

    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when

    // opaque contexts — file:// — everything serializes as 'null', where

        <img src=\"c83c7f6c-8634-4e0d-93fa-c5a1e19a71eb\" alt=\"\" style=\"width: 38px; height: 38px; object-fit: contain; filter: var(--logo-filter); mix-blend-mode: var(--logo-blend);\">\n        <span style=\"font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16.5px; font-weight: 600; letter-spacing: 0.01em;\">Lillis Productions<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 24px; font-size: 14px;\">\n        <a href=\"#services\" style=\"color: var(--muted);\" style-hover=\"color: var(--text);\">Services<\u002Fa>\n        <a href=\"#work\" style=\"color: var(--muted);\" style-hover=\"color: var(--text);\">Work<\u002Fa>\n        <a href=\"#packages\" style=\"color: var(--muted);\" style-hover=\"color: var(--text);\">Packages<\u002Fa>\n        <a href=\"#contact\" style=\"color: var(--muted);\" style-hover=\"color: var(--text);\">Contact<\u002Fa>\n      <\u002Fdiv>\n      <span style=\"font-size: 13.5px; color: var(--muted);\">© 2026 Lillis Productions · Houston, TX<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'dark'|'light'&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e13b82&quot;,&quot;options&quot;:[&quot;#e13b82&quot;,&quot;#b3123f&quot;,&quot;#1f6feb&quot;,&quot;#0f766e&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;showPricing&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { q: 0, sent: false, narrow: false, menuOpen: false };\n\n  componentDidMount() {\n    let saved = null;\n    try { saved = localStorage.getItem(\"lp-theme\"); } catch (e) {}\n    this.themeMq = window.matchMedia(\"(prefers-color-scheme: light)\");\n    this.onTheme = () => { if (!this.state.userTheme) this.setState({ sysLight: this.themeMq.matches }); };\n    this.themeMq.addEventListener(\"change\", this.onTheme);\n    this.setState({ userTheme: saved === \"light\" || saved === \"dark\" ? saved : null, sysLight: this.themeMq.matches });\n    this.applyTheme();\n    this.mq = window.matchMedia(\"(max-width: 760px)\");\n    this.onMq = () => this.setState({ narrow: this.mq.matches, menuOpen: false });\n    this.onMq();\n    this.mq.addEventListener(\"change\", this.onMq);\n  }\n\n  componentWillUnmount() {\n    if (this.mq) this.mq.removeEventListener(\"change\", this.onMq);\n    if (this.themeMq) this.themeMq.removeEventListener(\"change\", this.onTheme);\n  }\n\n  theme() {\n    if (this.state.userTheme) return this.state.userTheme;\n    if (this.props.theme === \"light\" || this.props.theme === \"dark\") return this.props.theme;\n    return this.state.sysLight ? \"light\" : \"dark\";\n  }\n\n  setTheme(t) {\n    try { localStorage.setItem(\"lp-theme\", t); } catch (e) {}\n    this.setState({ userTheme: t });\n  }\n  componentDidUpdate() { this.applyTheme(); }\n\n  applyTheme() {\n    const light = this.theme() === \"light\";\n    const accent = this.props.accentColor || \"#e13b82\";\n    const r = document.documentElement.style;\n    r.setProperty(\"--accent\", accent);\n    if (light) {\n      r.setProperty(\"--bg\", \"#fffdfc\");\n      r.setProperty(\"--surface\", \"#f7f2f4\");\n      r.setProperty(\"--surface2\", \"#ece5e8\");\n      r.setProperty(\"--line\", \"rgba(20,10,15,0.12)\");\n      r.setProperty(\"--text\", \"#171316\");\n      r.setProperty(\"--muted\", \"#6d6469\");\n      r.setProperty(\"--logo-filter\", \"none\");\n      r.setProperty(\"--logo-blend\", \"normal\");\n    } else {\n      r.setProperty(\"--bg\", \"#0d0c0d\");\n      r.setProperty(\"--surface\", \"#171517\");\n      r.setProperty(\"--surface2\", \"#1f1c1f\");\n      r.setProperty(\"--line\", \"rgba(255,255,255,0.10)\");\n      r.setProperty(\"--text\", \"#f6f3f2\");\n      r.setProperty(\"--muted\", \"#a8a2a4\");\n      r.setProperty(\"--logo-filter\", \"invert(1)\");\n      r.setProperty(\"--logo-blend\", \"screen\");\n    }\n  }\n\n  quotes = [\n    { text: \"She took over our social completely and our phone started ringing within the first month. The content actually looks like our shop, not a stock photo.\",\n      name: \"Marisol R.\", role: \"Owner, Bloom & Vine Florals\" },\n    { text: \"I never had time to post. Now I get 12 pieces a month, captions written, comments answered, and I don't lift a finger.\",\n      name: \"Andre W.\", role: \"Founder, Westside Barbers\" },\n    { text: \"Professional from the first call. The shoot day was fun, the edits were fast, and the Reels outperformed anything we'd made before.\",\n      name: \"Kayla T.\", role: \"Manager, Cedar Row Cafe\" }\n  ];\n\n  renderVals() {\n    const dark = this.theme() !== \"light\";\n    const isLight = !dark;\n    const q = this.state.q % this.quotes.length;\n    return {\n      showPricing: this.props.showPricing !== false,\n      isLight: isLight,\n      isDark: dark,\n      knobLeft: isLight ? \"27px\" : \"3px\",\n      toggleTheme: () => this.setTheme(dark ? \"light\" : \"dark\"),\n      themeLabel: dark ? \"Switch to light mode\" : \"Switch to dark mode\",\n      isNarrow: this.state.narrow,\n      isWide: !this.state.narrow,\n      menuOpen: this.state.narrow && this.state.menuOpen,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      services: [\n        { num: \"01\", title: \"Content Strategy\", body: \"A monthly plan built on what your local audience is actually searching for and saving.\" },\n        { num: \"02\", title: \"Reels & Short-Form\", body: \"Scroll-stopping vertical video shot, edited and scheduled for maximum reach.\" },\n        { num: \"03\", title: \"Photography\", body: \"Monthly on-location shoots that give you a library of images you can reuse everywhere.\" },\n        { num: \"04\", title: \"Community Management\", body: \"Comments, DMs and reviews answered in your voice so no lead goes cold.\" },\n        { num: \"05\", title: \"Local SEO & Hashtags\", body: \"Captions, keywords and tags tuned so nearby customers find you first.\" },\n        { num: \"06\", title: \"Website & Maintenance\", body: \"A clean, fast single-page site to send every lead to \\u2014 kept up to date for you.\" }\n      ],\n      gallery: [\n        { label: \"brand shoot / hero\", col: \"span 2\", row: \"span 2\" },\n        { label: \"reel cover\", col: \"span 1\", row: \"span 1\" },\n        { label: \"product detail\", col: \"span 1\", row: \"span 1\" },\n        { label: \"behind the scenes\", col: \"span 2\", row: \"span 1\" },\n        { label: \"team portrait\", col: \"span 1\", row: \"span 1\" },\n        { label: \"campaign still\", col: \"span 1\", row: \"span 1\" },\n        { label: \"event coverage\", col: \"span 2\", row: \"span 1\" }\n      ],\n      packages: [\n        { name: \"Presence\", tag: \"Starter\", price: \"$350\", cta: \"Choose Presence\",\n          bg: \"var(--surface)\", border: \"var(--line)\", tagColor: \"var(--muted)\",\n          ctaBg: \"transparent\", ctaColor: \"var(--text)\",\n          items: [\"Managed content across 1 platform (TikTok)\", \"6 strategic content pieces monthly\", \"Caption writing for reach + local discovery\", \"Hashtag & SEO optimization for your area\", \"Light engagement support (comments & DMs)\", \"1-hour content shoot monthly\"] },\n        { name: \"Growth\", tag: \"Most popular\", price: \"$550\", cta: \"Choose Growth\",\n          bg: dark ? \"color-mix(in oklab, var(--accent) 12%, var(--surface))\" : \"color-mix(in oklab, var(--accent) 8%, var(--surface))\",\n          border: \"var(--accent)\", tagColor: \"var(--accent)\",\n          ctaBg: \"var(--accent)\", ctaColor: \"#fff\",\n          items: [\"Managed content across 2 platforms (Instagram & TikTok)\", \"12 high-performing pieces monthly, Reel-focused\", \"Active community management\", \"Content optimized for engagement, shares & saves\", \"2-hour content shoot monthly\"] },\n        { name: \"Expansion\", tag: \"Full service\", price: \"$1000\", cta: \"Choose Expansion\",\n          bg: \"var(--surface)\", border: \"var(--line)\", tagColor: \"var(--muted)\",\n          ctaBg: \"transparent\", ctaColor: \"var(--text)\",\n          items: [\"Managed content across 3 platforms (Instagram, Facebook, TikTok)\", \"20 premium pieces monthly, heavy Reel strategy\", \"Full-scale strategy for growth + conversions\", \"Ongoing audience interaction & response management\", \"Website design + ongoing maintenance\", \"2\\u20133 hour professional shoot monthly\"] }\n      ],\n      quote: this.quotes[q],\n      quoteDots: this.quotes.map((_, i) => ({ color: i === q ? \"var(--accent)\" : \"var(--line)\" })),\n      nextQuote: () => this.setState(s => ({ q: s.q + 1 })),\n      prevQuote: () => this.setState(s => ({ q: (s.q + this.quotes.length - 1) })),\n      formNote: this.state.sent ? \"Opening your email app \\u2014 hit send and it lands in the Lillis inbox.\" : \"Goes straight to the Lillis Productions inbox. No spam, ever.\",\n      submit: (e) => {\n        e.preventDefault();\n        const f = new FormData(e.target);\n        const body = \"Name: \" + (f.get(\"name\") || \"\") + \"\\nEmail: \" + (f.get(\"email\") || \"\") +\n          \"\\nBusiness: \" + (f.get(\"business\") || \"\") + \"\\nPackage: \" + (f.get(\"package\") || \"\") +\n          \"\\n\\n\" + (f.get(\"message\") || \"\");\n        window.location.href = \"mailto:hello@lillisproductions.com?subject=\" +\n          encodeURIComponent(\"New inquiry from \" + (f.get(\"name\") || \"the website\")) +\n          \"&body=\" + encodeURIComponent(body);\n        this.setState({ sent: true });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
